<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-Memory Card Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --glass: rgba(255, 255, 255, 0.03);
            --text: #f8fafc;
            --accent: #f43f5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(244, 63, 94, 0.1) 0%, transparent 40%);
        }

        /* --- Menu Styles --- */
        #menu-screen {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818cf8, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 3rem;
        }

        .level-selector {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            transform: translateY(-5px);
            background: var(--primary);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn.difficult:hover {
            background: var(--accent);
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.4);
        }

        /* --- Game Styles --- */
        #game-screen {
            display: none;
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            flex-direction: column;
            align-items: center;
        }

        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--glass);
            padding: 1rem 2rem;
            border-radius: 20px;
            border: 1px solid var(--card-border);
        }

        .stats {
            display: flex;
            gap: 2rem;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .stat-item span {
            color: var(--primary);
            margin-left: 0.5rem;
        }

        .grid {
            display: grid;
            gap: 12px;
            perspective: 1000px;
            width: fit-content;
            margin: 0 auto;
        }

        /* Responsive Grid Sizes */
        .grid-easy {
            grid-template-columns: repeat(5, 100px);
        }

        .grid-medium {
            grid-template-columns: repeat(5, 100px);
        }

        .grid-difficult {
            grid-template-columns: repeat(12, 80px);
        }

        @media (max-width: 1000px) {
            .grid-difficult {
                grid-template-columns: repeat(7, 80px);
            }
        }

        @media (max-width: 600px) {
            .grid-easy {
                grid-template-columns: repeat(2, 120px);
            }

            .grid-medium {
                grid-template-columns: repeat(4, 80px);
            }

            .grid-difficult {
                grid-template-columns: repeat(4, 70px);
            }

            .level-selector {
                flex-direction: column;
                align-items: stretch;
            }
        }

        .card {
            aspect-ratio: 1 / 1;
            width: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-front {
            background: var(--primary);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .card-front::after {
            content: '?';
            font-size: 2rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.3);
        }

        .card-back {
            background: white;
            transform: rotateY(180deg);
        }

        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card.matched {
            pointer-events: none;
            transform: rotateY(180deg) scale(1.05);
            z-index: 5;
        }

        .card.matched .card-back {
            border: 3px solid #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        /* --- Win Modal --- */
        #win-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 32px;
            border: 1px solid var(--card-border);
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-content h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #fbbf24;
        }

        .modal-stats {
            margin: 2rem 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 16px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Menu Screen -->
    <div id="menu-screen">
        <h1>Yu-Memory Animals</h1>
        <p class="subtitle">Uji ingatanmu dengan gambar hewan yang lucu!</p>
        <div class="level-selector">
            <button class="btn" onclick="startGame('easy')">Easy (10 Cards)</button>
            <button class="btn" onclick="startGame('medium')">Medium (20 Cards)</button>
            <button class="btn difficult" onclick="startGame('difficult')">Difficult (All Cards)</button>
        </div>
        <p style="margin-top: 8rem; font-size: 0.8rem;">Copyright © 2026 ayudia putri rahayu.</p>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
        <div class="game-header">
            <button class="btn" style="padding: 0.5rem 1.5rem" onclick="backToMenu()">← Menu</button>
            <div class="stats">
                <div class="stat-item">Moves: <span id="move-count">0</span></div>
                <div class="stat-item">Time: <span id="timer">00:00</span></div>
            </div>
        </div>
        <div class="grid" id="grid"></div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal">
        <div class="modal-content">
            <h2>Luar Biasa!</h2>
            <p>Kamu telah menemukan semua pasangan hewan.</p>
            <div class="modal-stats">
                <div class="stat-card">
                    <div class="stat-label">Total Moves</div>
                    <div class="stat-value" id="final-moves">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Time Spent</div>
                    <div class="stat-value" id="final-time">00:00</div>
                </div>
            </div>
            <button class="btn" onclick="backToMenu()" style="width: 100%; background: var(--primary)">Main
                Lagi</button>
        </div>
    </div>

    <script>
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const winModal = document.getElementById('win-modal');
        const grid = document.getElementById('grid');
        const moveDisplay = document.getElementById('move-count');
        const timerDisplay = document.getElementById('timer');

        let cards = [];
        let flippedCards = [];
        let moves = 0;
        let matches = 0;
        let timerInterval;
        let seconds = 0;
        let isLockBoard = false;

        const totalImagesAvailable = 42;

        function startGame(level) {
            let numPairs;
            grid.className = 'grid'; // Reset grid classes

            if (level === 'easy') {
                numPairs = 5;
                grid.classList.add('grid-easy');
            } else if (level === 'medium') {
                numPairs = 10;
                grid.classList.add('grid-medium');
            } else {
                numPairs = totalImagesAvailable;
                grid.classList.add('grid-difficult');
            }

            // Reset Game State
            moves = 0;
            matches = 0;
            seconds = 0;
            flippedCards = [];
            moveDisplay.innerText = moves;
            timerDisplay.innerText = "00:00";
            isLockBoard = false;

            // Generate Cards
            const imageIndices = [];
            // Create a list of available indices and shuffle to pick random ones for smaller levels
            const allIndices = Array.from({ length: totalImagesAvailable }, (_, i) => i + 1);
            allIndices.sort(() => Math.random() - 0.5);

            const selectedIndices = allIndices.slice(0, numPairs);
            const gameCards = [...selectedIndices, ...selectedIndices];
            gameCards.sort(() => Math.random() - 0.5);

            // Create Board
            grid.innerHTML = '';
            gameCards.forEach(imgIndex => {
                const cardEl = createCardElement(imgIndex);
                grid.appendChild(cardEl);
            });

            // Switch Screen
            menuScreen.style.display = 'none';
            gameScreen.style.display = 'flex';

            startTimer();
        }

        function createCardElement(imgIndex) {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.id = imgIndex;

            card.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-face card-back">
                    <img src="img/${imgIndex}.jpg" alt="Animal">
                </div>
            `;

            card.addEventListener('click', () => flipCard(card));
            return card;
        }

        function flipCard(card) {
            if (isLockBoard) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            moves++;
            moveDisplay.innerText = moves;
            isLockBoard = true;

            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matches++;
                resetTurn();

                const totalPairs = grid.children.length / 2;
                if (matches === totalPairs) {
                    setTimeout(endGame, 500);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    resetTurn();
                }, 1000);
            }
        }

        function resetTurn() {
            flippedCards = [];
            isLockBoard = false;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                timerDisplay.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('final-moves').innerText = moves;
            document.getElementById('final-time').innerText = timerDisplay.innerText;
            winModal.style.display = 'flex';
        }

        function backToMenu() {
            clearInterval(timerInterval);
            winModal.style.display = 'none';
            gameScreen.style.display = 'none';
            menuScreen.style.display = 'block';
        }
    </script>
</body>

</html>
